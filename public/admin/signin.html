<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiro Platform - Admin Sign In</title>
    <script src="https://cdn.tailwindcss.com?v=3.4.1"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-[#e0f7fa] to-[#e8f5e9] h-screen flex items-center justify-center">
    
    <div class="bg-white/80 backdrop-blur-xl p-8 rounded-3xl shadow-[0_8px_30px_rgb(0,0,0,0.04)] border border-white w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-3xl text-teal-800 font-bold tracking-tight">Hiro Admin</h1>
            <p class="text-teal-600/70 text-sm mt-2">Masuk ke ruang kerja Anda</p>
        </div>
        
        <form id="loginForm" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-teal-700 mb-1.5">Username</label>
                <input type="text" id="username" class="w-full border-0 bg-teal-50/50 rounded-xl p-3.5 text-teal-900 shadow-inner focus:ring-2 focus:ring-teal-400 focus:outline-none transition-all" required>
            </div>
            <div>
                <label class="block text-sm font-medium text-teal-700 mb-1.5">Password</label>
                <input type="password" id="password" class="w-full border-0 bg-teal-50/50 rounded-xl p-3.5 text-teal-900 shadow-inner focus:ring-2 focus:ring-teal-400 focus:outline-none transition-all" required>
            </div>
            <button type="submit" class="w-full bg-gradient-to-r from-teal-500 to-emerald-400 hover:from-teal-600 hover:to-emerald-500 text-white font-medium p-3.5 rounded-xl shadow-md transform active:scale-[0.98] transition-all">
                Sign In
            </button>
        </form>

        <div id="toast" class="hidden mt-6 bg-red-50 border border-red-100 text-red-600 px-4 py-3 rounded-xl relative text-sm text-center shadow-sm">
            <span id="toastMsg"></span>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: u, password: p })
            });
            const data = await res.json();
            
            if (data.success) {
                window.location.href = data.redirect;
            } else {
                const toast = document.getElementById('toast');
                document.getElementById('toastMsg').textContent = data.message;
                toast.classList.remove('hidden');
                setTimeout(() => toast.classList.add('hidden'), 3000);
            }
        });
    </script>
</body>
</html>
