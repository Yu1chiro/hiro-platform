<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - Hiro</title>
    <script src="https://cdn.tailwindcss.com?v=3.4.1"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        cream: { 50: '#FFFDF8', 100: '#FBF6E9', 200: '#F3ECD6' },
                        sage:  { 50: '#F2F8F1', 100: '#E3F1E0', 200: '#C9E4C4', 300: '#A8D5A0', 400: '#8AC17F', 500: '#6FAE68', 600: '#59955A', 700: '#457048' },
                        forest:{ 50: '#EEF4EC', 300: '#7C9A81', 500: '#4E6B53', 700: '#34513A', 900: '#243A28' },
                        blush: { 100: '#FDE7E2', 300: '#F4BDB1', 400: '#EFA79C', 500: '#E88C7D' }
                    },
                    fontFamily: {
                        display: ['"Baloo 2"', 'cursive'],
                        body: ['"Nunito"', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Nunito', sans-serif; }
        h1, h2, h3, .font-display { font-family: 'Baloo 2', cursive; }
        .ql-toolbar { border-radius: 0.9rem 0.9rem 0 0 !important; border-color: #DCEFDA !important; background: white; }
        .ql-container { border-radius: 0 0 0.9rem 0.9rem !important; border-color: #DCEFDA !important; background: white; }
        ::selection { background: #C9E4C4; color: #243A28; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #C9E4C4; border-radius: 999px; }
    </style>
</head>
<body class="bg-gradient-to-br from-[#FBF6E9] to-[#EAF3E6] text-forest-900 font-body flex flex-col md:flex-row min-h-screen">
    
    <div id="toast" class="fixed top-5 right-5 z-50 hidden transform transition-all duration-300">
        <div class="bg-white/90 backdrop-blur-md text-forest-800 px-6 py-4 rounded-2xl shadow-xl flex items-center gap-3 border border-white">
            <i class="fas fa-check-circle text-sage-500 text-xl"></i>
            <span id="toastMsg" class="font-medium">Berhasil!</span>
        </div>
    </div>

    <aside class="hidden md:flex md:w-72 bg-white/60 backdrop-blur-xl border-r border-white flex-col fixed inset-y-0 z-10 shadow-[4px_0_24px_rgba(52,81,58,0.04)]">
        <div class="p-8 text-2xl font-bold tracking-tight text-forest-700 font-display flex items-center gap-2">
            <i class="fas fa-leaf text-sage-500 text-lg"></i> Hiro Admin
        </div>
        <nav class="flex-1 px-4 space-y-2">
            <button onclick="switchTab('platforms')" class="w-full text-left px-5 py-3.5 rounded-xl hover:bg-sage-50 hover:text-forest-700 flex items-center gap-4 text-forest-500 font-medium transition-all focus:bg-sage-50">
                <i class="fas fa-link w-5"></i> Link Platform
            </button>
            <button onclick="switchTab('broadcasts')" class="w-full text-left px-5 py-3.5 rounded-xl hover:bg-sage-50 hover:text-forest-700 flex items-center gap-4 text-forest-500 font-medium transition-all focus:bg-sage-50">
                <i class="fas fa-bullhorn w-5"></i> Broadcast
            </button>
            <button onclick="switchTab('requests')" class="w-full text-left px-5 py-3.5 rounded-xl hover:bg-sage-50 hover:text-forest-700 flex items-center gap-4 text-forest-500 font-medium transition-all focus:bg-sage-50">
                <i class="fas fa-inbox w-5"></i> Resource Request
            </button>
        </nav>
        <div class="p-6">
            <button onclick="logout()" class="w-full text-left px-5 py-3.5 text-blush-500 hover:bg-blush-100 hover:text-blush-500 rounded-xl flex items-center gap-4 font-medium transition-all">
                <i class="fas fa-sign-out-alt w-5"></i> Logout
            </button>
        </div>
    </aside>

    <main class="flex-1 md:ml-72 p-6 md:p-10 mb-20 md:mb-0">
        
        <!-- Tab Platforms -->
        <div id="tab-platforms" class="spa-view block">
            <div class="flex justify-between items-center mb-8">
                <h2 class="text-3xl font-bold text-forest-700 font-display">Link Platform</h2>
                <button onclick="openModal('platformModal')" class="bg-gradient-to-r from-sage-500 to-sage-600 hover:from-sage-600 hover:to-sage-700 text-white px-5 py-2.5 rounded-xl shadow-md font-medium transition-transform active:scale-95"><i class="fas fa-plus mr-2"></i> Baru</button>
            </div>
            <div class="bg-white/80 backdrop-blur-md rounded-3xl shadow-sm border border-white overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm" id="platformTable">
                        <thead class="bg-sage-50/60 text-forest-500 font-medium">
                            <tr><th class="p-5">Title</th><th class="p-5">Link</th><th class="p-5">Aksi</th></tr>
                        </thead>
                        <tbody class="divide-y divide-sage-50"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- Tab Broadcasts (Lengkap Form Edit/Create & Tabel Manajemen) -->
        <div id="tab-broadcasts" class="spa-view hidden space-y-8">
            <div>
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-3xl font-bold text-forest-700 font-display" id="bcFormTitle">Kirim Broadcast Baru</h2>
                    <button id="cancelEditBcBtn" onclick="resetBroadcastForm()" class="hidden bg-sage-100 text-forest-500 text-xs px-4 py-2 rounded-xl font-medium">Batal Edit</button>
                </div>
                <div class="bg-white/80 backdrop-blur-md p-8 rounded-3xl shadow-sm border border-white">
                    <input type="hidden" id="bcId">
                    <input type="text" id="bcTitle" placeholder="Judul Broadcast" class="w-full mb-6 border-0 bg-sage-50/60 p-4 rounded-xl shadow-inner focus:outline-none focus:ring-2 focus:ring-sage-400 text-forest-900 font-medium">
                    <div id="quill-editor" class="h-72"></div>
                    <div class="mt-6 flex justify-end">
                        <button onclick="saveBroadcast()" id="bcSubmitBtn" class="bg-gradient-to-r from-sage-500 to-sage-600 hover:from-sage-600 hover:to-sage-700 text-white px-8 py-3 rounded-xl shadow-md font-medium transition-transform active:scale-95 w-full md:w-auto">Kirim Broadcast</button>
                    </div>
                </div>
            </div>

            <div>
                <h3 class="text-xl font-bold text-forest-700 mb-4 font-display">Daftar Broadcast Terkirim</h3>
                <div class="bg-white/80 backdrop-blur-md rounded-3xl shadow-sm border border-white overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm" id="broadcastTable">
                            <thead class="bg-sage-50/60 text-forest-500 font-medium">
                                <tr><th class="p-5">Judul</th><th class="p-5">Waktu</th><th class="p-5">Aksi</th></tr>
                            </thead>
                            <tbody class="divide-y divide-sage-50"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Tab Requests -->
        <div id="tab-requests" class="spa-view hidden">
            <div class="mb-8">
                <h2 class="text-3xl font-bold text-forest-700 font-display">Resource Requests</h2>
            </div>
            <div class="bg-white/80 backdrop-blur-md rounded-3xl shadow-sm border border-white overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm" id="requestTable">
                        <thead class="bg-sage-50/60 text-forest-500 font-medium">
                            <tr><th class="p-5">Nama</th><th class="p-5">Kontak</th><th class="p-5">Deskripsi</th><th class="p-5">Aksi</th></tr>
                        </thead>
                        <tbody class="divide-y divide-sage-50"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>

    <nav class="md:hidden fixed bottom-0 w-full bg-white/90 backdrop-blur-xl border-t border-white flex justify-around p-2 pb-6 z-40 shadow-[0_-10px_30px_rgba(52,81,58,0.08)]">
        <button onclick="switchTab('platforms')" class="flex flex-col items-center text-forest-500 p-2">
            <i class="fas fa-link text-xl mb-1.5"></i><span class="text-[10px] font-medium">Links</span>
        </button>
        <button onclick="switchTab('broadcasts')" class="flex flex-col items-center text-forest-500 p-2">
            <i class="fas fa-bullhorn text-xl mb-1.5"></i><span class="text-[10px] font-medium">Broadcast</span>
        </button>
        <button onclick="switchTab('requests')" class="flex flex-col items-center text-forest-500 p-2">
            <i class="fas fa-inbox text-xl mb-1.5"></i><span class="text-[10px] font-medium">Requests</span>
        </button>
        <button onclick="logout()" class="flex flex-col items-center text-blush-400 p-2">
            <i class="fas fa-sign-out-alt text-xl mb-1.5"></i><span class="text-[10px] font-medium">Logout</span>
        </button>
    </nav>

    <!-- Modal Form Platform -->
    <div id="platformModal" class="hidden fixed inset-0 bg-forest-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-md shadow-2xl p-8 transform transition-all">
            <h3 class="text-2xl font-bold text-forest-700 mb-6 font-display" id="modalTitle">Tambah Platform</h3>
            <input type="hidden" id="platId">
            <div class="space-y-5">
                <div>
                    <label class="text-sm font-medium text-forest-500 block mb-1.5">Title</label>
                    <input type="text" id="platTitle" class="w-full border-0 bg-sage-50 p-3.5 rounded-xl shadow-inner focus:outline-none focus:ring-2 focus:ring-sage-400">
                </div>
                <div>
                    <label class="text-sm font-medium text-forest-500 block mb-1.5">Description</label>
                    <textarea id="platDesc" class="w-full border-0 bg-sage-50 p-3.5 rounded-xl shadow-inner h-28 focus:outline-none focus:ring-2 focus:ring-sage-400"></textarea>
                </div>
                <div>
                    <label class="text-sm font-medium text-forest-500 block mb-1.5">Link Website</label>
                    <input type="url" id="platLink" class="w-full border-0 bg-sage-50 p-3.5 rounded-xl shadow-inner focus:outline-none focus:ring-2 focus:ring-sage-400">
                </div>
            </div>
            <div class="mt-8 flex justify-end gap-3">
                <button onclick="closeModal('platformModal')" class="px-5 py-2.5 bg-sage-50 hover:bg-sage-100 text-forest-500 font-medium rounded-xl transition-colors">Batal</button>
                <button onclick="savePlatform()" class="px-5 py-2.5 bg-gradient-to-r from-sage-500 to-sage-600 hover:from-sage-600 hover:to-sage-700 text-white font-medium rounded-xl shadow-md">Simpan</button>
            </div>
        </div>
    </div>

    <!-- Modal Konfirmasi Delete -->
    <div id="deleteModal" class="hidden fixed inset-0 bg-forest-900/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl w-full max-w-sm shadow-2xl p-8 text-center">
            <div class="text-blush-400 text-5xl mb-4"><i class="fas fa-trash-alt"></i></div>
            <h3 class="text-xl font-bold text-forest-900 mb-2 font-display">Hapus Data?</h3>
            <p class="text-forest-500/70 text-sm mb-8">Tindakan ini permanen dan tidak dapat dibatalkan.</p>
            <div class="flex justify-center gap-3">
                <button onclick="closeModal('deleteModal')" class="px-6 py-2.5 bg-sage-50 hover:bg-sage-100 text-forest-500 font-medium rounded-xl">Batal</button>
                <button id="confirmDelBtn" class="px-6 py-2.5 bg-blush-500 hover:bg-blush-400 text-white font-medium rounded-xl shadow-md">Hapus</button>
            </div>
        </div>
    </div>

    <script>
        const quill = new Quill('#quill-editor', {
            theme: 'snow',
            modules: {
                toolbar: [
                    [{ 'header': [1, 2, 3, false] }],
                    ['bold', 'italic', 'underline', 'strike'],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    ['link'], ['clean']
                ]
            }
        });

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 3000);
        }

        function switchTab(tab) {
            document.querySelectorAll('.spa-view').forEach(el => el.classList.add('hidden'));
            document.getElementById(`tab-${tab}`).classList.remove('hidden');
            if (tab === 'platforms') fetchPlatforms();
            if (tab === 'broadcasts') fetchBroadcasts();
            if (tab === 'requests') fetchRequests();
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { 
            document.getElementById(id).classList.add('hidden'); 
            if(id === 'platformModal') clearPlatForm();
        }

        function clearPlatForm() {
            document.getElementById('platId').value = '';
            document.getElementById('platTitle').value = '';
            document.getElementById('platDesc').value = '';
            document.getElementById('platLink').value = '';
        }

        let platformsData = [];
        let broadcastsData = [];

        async function fetchPlatforms() {
            const res = await fetch('/api/platforms');
            if(res.status === 401) return window.location.href = '/signin';
            platformsData = await res.json();
            const tbody = document.querySelector('#platformTable tbody');
            tbody.innerHTML = '';
            platformsData.forEach(p => {
                tbody.innerHTML += `
                    <tr class="hover:bg-sage-50/50 transition-colors">
                        <td class="p-5 font-semibold text-forest-900">${p.title}</td>
                        <td class="p-5 text-sage-600">${p.link}</td>
                        <td class="p-5">
                            <button onclick="editPlatform(${p.id})" class="bg-sage-100 text-sage-700 hover:bg-sage-200 p-2 rounded-lg mr-2"><i class="fas fa-pen"></i></button>
                            <button onclick="askDelete(${p.id}, 'platform')" class="bg-blush-100 text-blush-500 hover:bg-blush-300 p-2 rounded-lg"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        async function fetchBroadcasts() {
            const res = await fetch('/api/notifications');
            if(res.status === 401) return window.location.href = '/signin';
            broadcastsData = await res.json();
            const tbody = document.querySelector('#broadcastTable tbody');
            tbody.innerHTML = '';
            broadcastsData.forEach(b => {
                tbody.innerHTML += `
                    <tr class="hover:bg-sage-50/50 transition-colors">
                        <td class="p-5 font-semibold text-forest-900">${b.title}</td>
                        <td class="p-5 text-sage-600 text-xs">${b.created_at || '-'}</td>
                        <td class="p-5">
                            <button onclick="editBroadcast(${b.id})" class="bg-sage-100 text-sage-700 hover:bg-sage-200 p-2 rounded-lg mr-2"><i class="fas fa-pen"></i></button>
                            <button onclick="askDelete(${b.id}, 'broadcast')" class="bg-blush-100 text-blush-500 hover:bg-blush-300 p-2 rounded-lg"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        async function fetchRequests() {
            const res = await fetch('/api/requests');
            if(res.status === 401) return window.location.href = '/signin';
            const data = await res.json();
            const tbody = document.querySelector('#requestTable tbody');
            tbody.innerHTML = '';
            data.forEach(r => {
                tbody.innerHTML += `
                    <tr class="hover:bg-sage-50/50 transition-colors">
                        <td class="p-5 font-semibold text-forest-900">${r.name}</td>
                        <td class="p-5 text-sage-600">${r.contact}</td>
                        <td class="p-5 text-forest-700 text-sm max-w-xs truncate">${r.description}</td>
                        <td class="p-5">
                            <button onclick="askDelete(${r.id}, 'request')" class="bg-blush-100 text-blush-500 hover:bg-blush-300 p-2 rounded-lg"><i class="fas fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            });
        }

        async function savePlatform() {
            const id = document.getElementById('platId').value;
            const payload = {
                title: document.getElementById('platTitle').value,
                description: document.getElementById('platDesc').value,
                link: document.getElementById('platLink').value
            };
            const method = id ? 'PUT' : 'POST';
            const url = id ? `/api/platforms/${id}` : '/api/platforms';
            
            await fetch(url, { method, headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload) });
            closeModal('platformModal');
            showToast('Platform berhasil disimpan');
            fetchPlatforms();
        }

        function editPlatform(id) {
            const p = platformsData.find(x => x.id === id);
            document.getElementById('modalTitle').innerText = 'Edit Platform';
            document.getElementById('platId').value = p.id;
            document.getElementById('platTitle').value = p.title;
            document.getElementById('platDesc').value = p.description;
            document.getElementById('platLink').value = p.link;
            openModal('platformModal');
        }

        function editBroadcast(id) {
            const b = broadcastsData.find(x => x.id === id);
            document.getElementById('bcId').value = b.id;
            document.getElementById('bcTitle').value = b.title;
            quill.root.innerHTML = b.broadcast;
            document.getElementById('bcFormTitle').innerText = 'Edit Broadcast';
            document.getElementById('bcSubmitBtn').innerText = 'Update Broadcast';
            document.getElementById('cancelEditBcBtn').classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function resetBroadcastForm() {
            document.getElementById('bcId').value = '';
            document.getElementById('bcTitle').value = '';
            quill.setContents([]);
            document.getElementById('bcFormTitle').innerText = 'Kirim Broadcast Baru';
            document.getElementById('bcSubmitBtn').innerText = 'Kirim Broadcast';
            document.getElementById('cancelEditBcBtn').classList.add('hidden');
        }

        async function saveBroadcast() {
            const id = document.getElementById('bcId').value;
            const title = document.getElementById('bcTitle').value;
            const broadcast = quill.root.innerHTML;
            if(!title || quill.getText().trim().length === 0) return alert('Lengkapi data');
            
            const method = id ? 'PUT' : 'POST';
            const url = id ? `/api/notifications/${id}` : '/api/notifications';

            await fetch(url, { 
                method: method, 
                headers: {'Content-Type':'application/json'}, 
                body: JSON.stringify({title, broadcast}) 
            });
            
            resetBroadcastForm();
            showToast(id ? 'Broadcast berhasil diupdate' : 'Broadcast berhasil dikirim');
            fetchBroadcasts();
        }

        let deleteIdTarget = null;
        let deleteTypeTarget = null;
        
        function askDelete(id, type) {
            deleteIdTarget = id;
            deleteTypeTarget = type;
            openModal('deleteModal');
        }
        
        document.getElementById('confirmDelBtn').onclick = async () => {
            if(deleteIdTarget) {
                let endpoint = '';
                if(deleteTypeTarget === 'platform') endpoint = `/api/platforms/${deleteIdTarget}`;
                else if(deleteTypeTarget === 'broadcast') endpoint = `/api/notifications/${deleteIdTarget}`;
                else if(deleteTypeTarget === 'request') endpoint = `/api/requests/${deleteIdTarget}`;

                await fetch(endpoint, { method: 'DELETE' });
                closeModal('deleteModal');
                showToast('Data berhasil dihapus');
                if(deleteTypeTarget === 'platform') fetchPlatforms();
                if(deleteTypeTarget === 'broadcast') fetchBroadcasts();
                if(deleteTypeTarget === 'request') fetchRequests();
            }
        };

        async function logout() {
            await fetch('/api/logout', {method: 'POST'});
            window.location.href = '/signin';
        }

        fetchPlatforms();
    </script>
</body>
</html>
