<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hiro Platform</title>
    <script src="https://cdn.tailwindcss.com?v=3.4.1"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f9ff; background-image: radial-gradient(at 0% 0%, hsla(153,60%,90%,1) 0, transparent 50%), radial-gradient(at 100% 0%, hsla(190,60%,90%,1) 0, transparent 50%); background-attachment: fixed; }
        .ql-editor { padding: 0 !important; }
        .ghibli-card { background: rgba(255, 255, 255, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.9); box-shadow: 0 10px 30px -10px rgba(0,0,0,0.05); }
        .ghibli-card:hover { transform: translateY(-3px); box-shadow: 0 15px 35px -10px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="text-teal-900 pb-24 select-none min-h-screen">

    <!-- Header -->
    <header class="ghibli-card px-6 py-4 sticky top-0 z-30 flex justify-between items-center rounded-b-3xl max-w-md mx-auto">
        <h1 class="text-2xl font-bold tracking-tight text-teal-800">Hiro<span class="text-teal-400 font-light">Platform</span></h1>
    </header>

    <!-- Main Container SPA -->
    <main class="p-5 max-w-md mx-auto">
        
        <!-- View: HOME (Bento Grid) -->
        <div id="view-home" class="spa-view block animate-[fadeIn_0.3s_ease-out]">
            <p class="text-sm text-teal-700/80 mb-5 font-medium px-1">Temukan Platform Tersedia</p>
            <div id="grid-container" class="grid grid-cols-2 gap-4"></div>
        </div>

        <!-- View: NOTIFICATION LIST -->
        <div id="view-notif" class="spa-view hidden animate-[fadeIn_0.3s_ease-out]">
            <div class="flex justify-between items-center mb-5 px-1">
                <p class="text-sm text-teal-700/80 font-medium">Pusat Informasi</p>
                <button onclick="openModal('requestModal')" class="bg-gradient-to-r from-teal-400 to-emerald-400 text-white text-xs px-4 py-2 rounded-full font-bold shadow-md shadow-emerald-200 flex items-center gap-2 transform active:scale-95 transition-all">
                    <i class="fas fa-paper-plane"></i> Request
                </button>
            </div>
            <div id="notif-container" class="space-y-4"></div>
        </div>

        <!-- View: NOTIFICATION DETAIL FULLSCREEN -->
        <div id="view-notif-detail" class="spa-view hidden animate-[fadeIn_0.3s_ease-out]">
            <div class="mb-4">
                <button onclick="switchView('notif')" class="inline-flex items-center gap-2 text-teal-700 bg-white/80 backdrop-blur-md px-4 py-2 rounded-2xl shadow-sm text-sm font-bold hover:bg-white transition-all">
                    <i class="fas fa-arrow-left"></i> Kembali ke Notifikasi
                </button>
            </div>
            <div class="ghibli-card p-6 rounded-[2rem] space-y-4">
                <div class="border-b border-teal-100/60 pb-4">
                    <span id="detailTimestamp" class="text-xs font-semibold text-teal-500 uppercase tracking-wider block mb-1"></span>
                    <h2 id="detailTitle" class="text-2xl font-bold text-teal-900 leading-tight"></h2>
                </div>
                <div id="detailBody" class="ql-editor text-teal-800/80 text-sm leading-relaxed font-medium min-h-[200px]"></div>
                <div class="pt-4 border-t border-teal-100/60">
                    <button id="detailMarkReadBtn" class="w-full bg-gradient-to-r from-teal-500 to-emerald-400 text-white p-4 rounded-2xl font-bold shadow-lg shadow-emerald-200 transform active:scale-95 transition-all">Tandai Dibaca</button>
                </div>
            </div>
        </div>

    </main>

    <!-- Mobile Native App Navbar Bottom -->
    <nav id="bottomNav" class="fixed bottom-4 w-[90%] left-[5%] max-w-[400px] sm:left-1/2 sm:-translate-x-1/2 bg-white/90 backdrop-blur-xl border border-white rounded-3xl flex justify-around p-2 z-40 shadow-[0_15px_40px_rgba(0,0,0,0.08)]">
        <button onclick="switchView('home')" id="nav-home" class="flex flex-col items-center text-teal-800 w-20 py-2 transition-colors relative rounded-2xl bg-teal-50">
            <i class="fas fa-layer-group text-2xl mb-1 drop-shadow-sm"></i><span class="text-[11px] font-bold">Home</span>
        </button>
        
        <button onclick="switchView('notif')" id="nav-notif" class="flex flex-col items-center text-teal-400 w-20 py-2 relative transition-colors rounded-2xl">
            <div id="notifBadge" class="hidden absolute top-1 right-5 w-3 h-3 bg-rose-400 rounded-full border-2 border-white shadow-sm"></div>
            <i class="far fa-bell text-2xl mb-1 drop-shadow-sm"></i><span class="text-[11px] font-bold">Notifikasi</span>
        </button>
    </nav>

    <!-- Modal Form Request Resource -->
    <div id="requestModal" class="hidden fixed inset-0 z-50 bg-teal-900/30 backdrop-blur-sm flex items-end sm:items-center justify-center sm:p-4">
        <div class="bg-white w-full sm:w-[400px] sm:rounded-3xl rounded-t-[2rem] shadow-2xl p-7 transform transition-transform border border-white">
            <div class="flex justify-between items-center mb-6">
                <h3 class="text-xl font-bold text-teal-800">Request Resource</h3>
                <button onclick="closeModal('requestModal')" class="text-teal-300 hover:text-teal-600 bg-teal-50 p-2 rounded-full"><i class="fas fa-times text-lg w-5 h-5 flex items-center justify-center"></i></button>
            </div>
            <form id="reqForm" class="space-y-4">
                <div>
                    <input type="text" id="reqName" placeholder="Nama Anda" class="w-full border-0 bg-teal-50 p-4 rounded-2xl shadow-inner focus:outline-none focus:ring-2 focus:ring-teal-400 text-teal-900 font-medium" required>
                </div>
                <div>
                    <input type="text" id="reqContact" placeholder="Email / WhatsApp" class="w-full border-0 bg-teal-50 p-4 rounded-2xl shadow-inner focus:outline-none focus:ring-2 focus:ring-teal-400 text-teal-900 font-medium" required>
                </div>
                <div>
                    <textarea id="reqDesc" placeholder="Deskripsi Resource yang diinginkan..." class="w-full border-0 bg-teal-50 p-4 rounded-2xl shadow-inner h-32 focus:outline-none focus:ring-2 focus:ring-teal-400 text-teal-900 font-medium" required></textarea>
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-teal-500 to-emerald-400 text-white p-4 rounded-2xl font-bold shadow-lg shadow-emerald-200 mt-2 transform active:scale-95 transition-all">Kirim Request</button>
            </form>
        </div>
    </div>

    <!-- Toast UI -->
    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 z-50 hidden">
        <div class="bg-emerald-500 text-white px-6 py-3 rounded-full shadow-lg shadow-emerald-200/50 flex items-center gap-3 font-bold text-sm">
            <i class="fas fa-check-circle"></i>
            <span id="toastMsg">Terkirim!</span>
        </div>
    </div>

    <script>
        let notifs = [];
        let readIds = JSON.parse(localStorage.getItem('readNotifs')) || [];

        function showToast(msg) {
            const t = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            t.classList.remove('hidden');
            setTimeout(() => t.classList.add('hidden'), 3500);
        }

        function openModal(id) { document.getElementById(id).classList.remove('hidden'); }
        function closeModal(id) { document.getElementById(id).classList.add('hidden'); }

        function switchView(view) {
            document.querySelectorAll('.spa-view').forEach(el => el.classList.add('hidden'));
            document.getElementById(`view-${view}`).classList.remove('hidden');
            
            const bottomNav = document.getElementById('bottomNav');
            if (view === 'notif-detail') {
                bottomNav.classList.add('hidden');
            } else {
                bottomNav.classList.remove('hidden');
                document.getElementById('nav-home').classList.replace(view==='home'?'text-teal-400':'text-teal-800', view==='home'?'text-teal-800':'text-teal-400');
                document.getElementById('nav-notif').classList.replace(view==='notif'?'text-teal-400':'text-teal-800', view==='notif'?'text-teal-800':'text-teal-400');
                
                document.querySelector('#nav-notif i').className = view === 'notif' ? 'fas fa-bell text-2xl mb-1 drop-shadow-sm' : 'far fa-bell text-2xl mb-1 drop-shadow-sm';
                
                if(view === 'home') document.getElementById('nav-home').classList.add('bg-teal-50'); else document.getElementById('nav-home').classList.remove('bg-teal-50');
                if(view === 'notif') document.getElementById('nav-notif').classList.add('bg-teal-50'); else document.getElementById('nav-notif').classList.remove('bg-teal-50');
            }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function loadHome() {
            const res = await fetch('/api/platforms');
            const data = await res.json();
            const container = document.getElementById('grid-container');
            container.innerHTML = '';
            
            data.forEach(item => {
                const card = document.createElement('div');
                card.className = "ghibli-card p-5 rounded-[1.5rem] cursor-pointer flex flex-col justify-between h-36 transition-all";
                card.onclick = () => window.open(item.link, '_blank');
                card.innerHTML = `
                    <h3 class="font-bold text-teal-900 leading-tight">${item.title}</h3>
                    <p class="text-[11px] text-teal-700/70 line-clamp-2 mt-2 font-medium">${item.description}</p>
                    <div class="mt-auto pt-3 text-right"><div class="inline-flex bg-teal-100 text-teal-600 w-7 h-7 rounded-full items-center justify-center"><i class="fas fa-arrow-right text-xs"></i></div></div>
                `;
                container.appendChild(card);
            });
        }

        async function loadNotifs() {
            const res = await fetch('/api/notifications');
            notifs = await res.json();
            const container = document.getElementById('notif-container');
            container.innerHTML = '';
            
            let hasUnread = false;
            
            notifs.forEach(n => {
                const isRead = readIds.includes(n.id);
                if(!isRead) hasUnread = true;
                
                const card = document.createElement('div');
                card.className = `p-5 rounded-[1.5rem] transition-all cursor-pointer flex items-center justify-between ${isRead ? 'bg-white/50 border border-white/40 text-teal-600/50' : 'ghibli-card text-teal-900'}`;
                card.onclick = () => openNotifDetail(n.id);
                
                card.innerHTML = `
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-2xl ${isRead ? 'bg-teal-100/50 text-teal-400' : 'bg-gradient-to-br from-teal-400 to-emerald-400 text-white shadow-md shadow-emerald-200'} flex justify-center items-center text-xl">
                            <i class="fas ${isRead ? 'fa-envelope-open' : 'fa-envelope'}"></i>
                        </div>
                        <div>
                            <h4 class="font-bold text-[15px] leading-tight mb-1">${n.title}</h4>
                            <span class="text-[11px] font-medium ${isRead ? 'text-teal-500/50' : 'text-teal-600'}">${n.created_at || 'Baru'}</span>
                        </div>
                    </div>
                    ${!isRead ? '<div class="w-3 h-3 bg-rose-400 rounded-full shadow-sm"></div>' : ''}
                `;
                container.appendChild(card);
            });
            
            const badge = document.getElementById('notifBadge');
            if(hasUnread) badge.classList.remove('hidden');
            else badge.classList.add('hidden');
        }

        let currentActiveNotifId = null;

        function openNotifDetail(id) {
            const n = notifs.find(x => x.id === id);
            currentActiveNotifId = id;
            document.getElementById('detailTitle').innerText = n.title;
            document.getElementById('detailTimestamp').innerText = n.created_at || '';
            document.getElementById('detailBody').innerHTML = n.broadcast;
            
            const btn = document.getElementById('detailMarkReadBtn');
            if(readIds.includes(id)){
                btn.innerText = "Sudah dibaca";
                btn.disabled = true;
                btn.className = "w-full bg-teal-50 text-teal-400 p-4 rounded-2xl font-bold cursor-not-allowed";
            } else {
                btn.innerText = "Tandai Dibaca";
                btn.disabled = false;
                btn.className = "w-full bg-gradient-to-r from-teal-500 to-emerald-400 text-white p-4 rounded-2xl font-bold shadow-lg shadow-emerald-200 transform active:scale-95 transition-all";
            }
            
            switchView('notif-detail');
        }

        document.getElementById('detailMarkReadBtn').onclick = () => {
            if(!readIds.includes(currentActiveNotifId)) {
                readIds.push(currentActiveNotifId);
                localStorage.setItem('readNotifs', JSON.stringify(readIds));
                loadNotifs();
            }
            const btn = document.getElementById('detailMarkReadBtn');
            btn.innerText = "Sudah dibaca";
            btn.disabled = true;
            btn.className = "w-full bg-teal-50 text-teal-400 p-4 rounded-2xl font-bold cursor-not-allowed";
            showToast('Notifikasi ditandai dibaca');
        };

        document.getElementById('reqForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('reqName').value;
            const contact = document.getElementById('reqContact').value;
            const description = document.getElementById('reqDesc').value;
            const res = await fetch('/api/requests', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name, contact, description })
            });
            if(res.ok) {
                closeModal('requestModal');
                document.getElementById('reqForm').reset();
                showToast('Request berhasil terkirim!');
            }
        });

        loadHome();
        loadNotifs();

        if(window.location.pathname.includes('notification')) switchView('notif'); else switchView('home');
    </script>
</body>
</html>
